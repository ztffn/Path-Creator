<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pascal-time harness — M1.1 and M1.2, measured</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0e1116; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Pascal's published bundles read `process.env.NODE_ENV` at module scope (they are built
      for Next.js, where it always exists). Vite does not provide it, so without this shim the
      viewer throws "process is not defined" before it renders anything. This is a standing
      integration cost of consuming Pascal outside Next, not a workaround for this harness.
    -->
    <script>
      window.process = window.process || { env: { NODE_ENV: "development" } };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
